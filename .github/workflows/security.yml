name: Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  npm-audit:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Backend npm Audit
        working-directory: ./backend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Frontend npm Audit
        working-directory: ./frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  trivy-filesystem:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  trivy-images:

    needs: npm-audit

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Wait for Docker Hub
        run: sleep 20

      - name: Scan Backend Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/cyber-theme-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Scan Frontend Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/cyber-theme-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"
