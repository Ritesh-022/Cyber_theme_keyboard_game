name: Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  npm-audit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend npm Audit
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend npm Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  trivy-filesystem:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  trivy-images:

    needs:
      - npm-audit

    runs-on: ubuntu-latest

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Scan Backend Docker Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/cyber-theme-backend:latest
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan Frontend Docker Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/cyber-theme-frontend:latest
          severity: HIGH,CRITICAL
          exit-code: '1'