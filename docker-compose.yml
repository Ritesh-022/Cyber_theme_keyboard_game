services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend

    container_name: backend

    ports:
      - "5000:5000"

    depends_on:
      - mongodb

    env_file:
      - ./backend/.env

  frontend:

    build:
      context: ./frontend

    container_name: frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:

  mongo-data: